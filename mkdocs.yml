site_name: theaios-agent-auth
site_description: Agent-specific identity and access management for AI agents
site_url: https://cohorte-ai.github.io/agent-auth/
repo_name: Cohorte-ai/agent-auth
repo_url: https://github.com/Cohorte-ai/agent-auth

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts.md
      - Approval Tiers: approval-tiers.md
      - Sessions: sessions.md
      - Delegation: delegation.md
      - A2A Authorization: a2a.md
      - Expressions: expressions.md
  - Reference:
      - Config Syntax: config-syntax.md
      - CLI: cli.md
      - API Reference: api-reference.md
  - Integration: integration.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cohorte-ai/agent-auth
    - icon: fontawesome/solid/globe
      link: https://theaios.xyz
