[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theaios-agent-auth"
version = "0.1.1"
description = "Agent-specific identity and access management for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Charafeddine Mouzouni", email = "charafeddine@cohorte.co" },
]
keywords = ["agent-auth", "iam", "ai-agents", "permissions", "approval", "delegation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
guardrails = ["theaios-guardrails>=0.1"]
middleware = ["httpx>=0.27"]
all = ["theaios-agent-auth[guardrails,middleware]"]
dev = ["pytest>=8.0,<10", "ruff>=0.15,<0.16", "mypy>=1.19,<1.20", "types-pyyaml>=6.0", "pytest-asyncio>=1.0,<2"]

[project.scripts]
agent-auth = "theaios.agent_auth.cli:main"

[project.urls]
Homepage = "https://github.com/Cohorte-ai/agent-auth"
Documentation = "https://cohorte-ai.github.io/agent-auth/"
Repository = "https://github.com/Cohorte-ai/agent-auth"

[tool.hatch.build.targets.wheel]
packages = ["src/theaios"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["starlette.*", "flask.*", "theaios.guardrails.*"]
ignore_missing_imports = true
follow_imports = "skip"
